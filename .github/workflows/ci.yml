name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  matrix:
    name: matrix
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.config.outputs.builds }}
      test_image: ${{ steps.config.outputs.test_image }}
      test_gcc: ${{ steps.config.outputs.test_gcc }}
      test_arch: ${{ steps.config.outputs.test_arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify devcontainers
        run: python3 .devcontainer/generate.py --check

      - name: Read matrix
        id: config
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          matrix = json.loads(Path("ci/matrix.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              builds = json.dumps(matrix["build"], separators=(",", ":"))
              output.write(f"builds={builds}\n")
              for key in ("image", "gcc", "arch"):
                  output.write(f"test_{key}={matrix['test'][key]}\n")
          PY

  build:
    name: build (${{ matrix.cfg.name }})
    needs: matrix
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.cfg.image }}
    strategy:
      fail-fast: false
      matrix:
        cfg: ${{ fromJSON(needs.matrix.outputs.builds) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: /root/.cache/CPM
          key: cpm-${{ hashFiles('cmake/thirdparty/*.cmake', 'cmake/CPM.cmake', 'test/hll/CMakeLists.txt') }}
          restore-keys: |
            cpm-

      - name: Configure
        env:
          CC: gcc-${{ matrix.cfg.gcc }}
          CXX: g++-${{ matrix.cfg.gcc }}
          CUDAHOSTCXX: g++-${{ matrix.cfg.gcc }}
          CPM_SOURCE_CACHE: /root/.cache/CPM
        run: |
          cmake -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CUDA_ARCHITECTURES=${{ matrix.cfg.arch }}

      - name: Build
        # Builds all targets including the GPU test binaries, which catches
        # compile/link regressions on a CPU runner. The test job runs the
        # binaries on GPU hardware.
        run: cmake --build build --parallel

  test:
    name: test
    needs: [matrix, build]
    runs-on: "runs-on=${{ github.run_id }}/family=g4dn.xlarge/image=ubuntu24-gpu-x64"
    timeout-minutes: 120
    container:
      image: ${{ needs.matrix.outputs.test_image }}
      options: --gpus all
    steps:
      - name: Check GPU
        run: nvidia-smi
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: /root/.cache/CPM
          key: cpm-${{ hashFiles('cmake/thirdparty/*.cmake', 'cmake/CPM.cmake', 'test/hll/CMakeLists.txt') }}
          restore-keys: |
            cpm-
      - name: Configure
        env:
          CC: gcc-${{ needs.matrix.outputs.test_gcc }}
          CXX: g++-${{ needs.matrix.outputs.test_gcc }}
          CUDAHOSTCXX: g++-${{ needs.matrix.outputs.test_gcc }}
          CPM_SOURCE_CACHE: /root/.cache/CPM
        run: |
          cmake -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CUDA_ARCHITECTURES=${{ needs.matrix.outputs.test_arch }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
