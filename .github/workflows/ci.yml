name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  matrix:
    name: matrix
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.config.outputs.builds }}
      test_image: ${{ steps.config.outputs.test_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify devcontainers and read matrix
        id: config
        run: python3 .devcontainer/generate.py --check --github-output "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.cfg.name }})
    needs: matrix
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.cfg.image }}
    strategy:
      fail-fast: false
      matrix:
        cfg: ${{ fromJSON(needs.matrix.outputs.builds) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: /root/.cache/CPM
          key: cpm-${{ hashFiles('CMakeLists.txt', 'cmake/thirdparty/*.cmake', 'cmake/get_cpm.cmake', 'test/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-

      - name: Configure
        env:
          CC: gcc-${{ matrix.cfg.gcc }}
          CXX: g++-${{ matrix.cfg.gcc }}
          CUDAHOSTCXX: g++-${{ matrix.cfg.gcc }}
          CUDACXX: /usr/local/cuda/bin/nvcc
          CPM_SOURCE_CACHE: /root/.cache/CPM
        run: |
          cmake -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CUDA_ARCHITECTURES="${{ matrix.cfg.arch }}"

      - name: Build
        run: cmake --build build --parallel 2

      - name: Package GPU tests
        if: matrix.cfg.id == 'latest'
        run: tar -cf gpu-tests.tar build

      - name: Upload GPU tests
        if: matrix.cfg.id == 'latest'
        uses: actions/upload-artifact@v4
        with:
          name: gpu-tests
          path: gpu-tests.tar
          retention-days: 1

  test:
    name: test
    needs: [matrix, build]
    runs-on: "runs-on=${{ github.run_id }}/family=g4dn.xlarge/image=ubuntu24-gpu-x64"
    timeout-minutes: 120
    container:
      image: ${{ needs.matrix.outputs.test_image }}
      options: --gpus all
    steps:
      - name: Check GPU
        run: nvidia-smi
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download GPU tests
        uses: actions/download-artifact@v4
        with:
          name: gpu-tests

      - name: Unpack GPU tests
        run: tar -xf gpu-tests.tar

      - name: Run tests
        run: |
          ctest --test-dir build --show-only=json-v1 \
            | python3 -c 'import json, sys; assert json.load(sys.stdin)["tests"], "No CTest tests discovered"'
          ctest --test-dir build --output-on-failure
